name: SyncFromPublicToMsft

on:
  # Automatically trigger at 00:00(UTC) everyday
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-push:
    if: github.repository_owner == 'Azure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup env
        run: |
          set -ex

          sudo apt update
          sudo apt install -y gh jq

          git config --global user.email "sonicbld@microsoft.com"
          git config --global user.name "Sonic Automation"
          git config --global pull.rebase false

          sudo rm -rf sonic-mgmt.msft
          git clone https://github.com/Azure/sonic-mgmt.msft  # dst repo

          pushd sonic-mgmt.msft
          git remote add head https://github.com/sonic-net/sonic-mgmt   # src repo
          git fetch head

      - name: Sync code from public to msft
        run: |
          set -ex

          branches="master 202412 202506 202511_azd 202601 202603 202606 202607 202608"
          conflicts_file="$GITHUB_WORKSPACE/conflicts.jsonl"
          rm -f "$conflicts_file"
          pushd sonic-mgmt.msft

          [ -z "$branches" ] && exit 1

          for branch in $branches; do
            branch_base=$branch
            branch_head=$branch

            if [[ $branch_head == "202412" ]]; then
              branch_head=202411
            fi
            if [[ $branch_head == "202506" ]]; then
              branch_head=202505
            fi
            if [[ $branch_head == "202512" ]]; then
              branch_head=202511
            fi
            if [[ $branch_head == "202511_azd" ]]; then
              branch_head=202511
            fi
            if [[ $branch_head == "202601" ]]; then
              branch_head=202511
            fi
            if [[ $branch_head == "202603" ]]; then
              branch_head=202511
            fi
            if [[ $branch_head == "202606" ]]; then
              branch_head=202605
            fi
            if [[ $branch_head == "202607" ]]; then
              branch_head=202605
            fi
            if [[ $branch_head == "202608" ]]; then
              branch_head=202605
            fi

            git ls-remote origin refs/heads/$branch_base || continue
            git ls-remote head refs/heads/$branch_head || continue

            head_commit=$(git log -n 1 --format=%H head/$branch_head)
            git log --format=%H origin/$branch_base | grep $head_commit && continue

            git checkout -b foo origin/$branch_base || true
            git branch -D $branch_base || true
            git checkout -b $branch_base --track origin/$branch_base

            git reset HEAD --hard
            git clean -xdff
            git status
            git status | grep "^nothing to commit, working tree clean" || continue


            prehead=$(git log -n 1 --pretty=format:'%H')
            pull_rc=0
            git pull head $branch_head --no-commit || pull_rc=$?
            # git merge --allow-unrelated-histories --no-edit head/branch_head
            git status

            if [[ $branch_base == "master" ]] &&
              git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
              echo "======Keeping Azure workflow files unchanged for master...======"
              git restore --source="$prehead" --staged --worktree -- .github/workflows
            fi

            unmerged_paths=$(git diff --name-only --diff-filter=U)
            if [[ -n "$unmerged_paths" ]]; then
              echo "======There are conflicts...======"
              echo "$unmerged_paths"
              jq -cn \
                --arg repo "Azure/sonic-mgmt.msft" \
                --arg branch "$branch_base" \
                --arg commit "$head_commit" \
                '{repo: $repo, branch: $branch, commit: $commit}' >> "$conflicts_file"
              git merge --abort
              continue
            fi
            if [[ $branch_base == "master" ]] &&
              git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
              pull_rc=0
            fi
            if [[ $pull_rc -ne 0 ]]; then
              exit "$pull_rc"
            fi
            GIT_EDITOR=true git merge --continue || true

            head=$(git log -n 1 --pretty=format:'%H')
            if [[ $prehead == $head ]];then
              echo "======No change after merging...======"
              continue
            fi
            echo "======Diff logs======"
            git log $prehead..HEAD --graph --pretty=format:'%h -%d %s (%cs) [%aN]'
            body=$(git log $prehead..HEAD --graph --pretty=format:'%h -%d %s (%cs) [%aN]')
            body='```<br>'$body'<br>```'

            # push code
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Azure/sonic-mgmt.msft HEAD:$branch_base

          done

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send conflict notifications
        if: always()
        run: |
          set -eo pipefail

          conflicts_file="$GITHUB_WORKSPACE/conflicts.jsonl"
          [[ -s "$conflicts_file" ]] || exit 0

          set +x
          if [[ -z "$CERT_NOTI_THUMBPRINT" ]]; then
            echo "CERT_NOTI_THUMBPRINT is not configured"
            exit 1
          fi

          while IFS= read -r conflict; do
            payload=$(echo "$conflict" | jq \
              --arg name "code_conflict" \
              --arg client "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '. + {name: $name, client: $client}')
            response=$(curl --fail-with-body --silent --show-error \
              -H 'Content-Type: application/json' \
              -H "thumbprint: $CERT_NOTI_THUMBPRINT" \
              -X POST https://notice-center.azurewebsites.net/noti_center/notice \
              -d "$payload")
            echo "$response" | jq -e '.success == true'
          done < "$conflicts_file"
        env:
          CERT_NOTI_THUMBPRINT: ${{ secrets.CERT_NOTI_THUMBPRINT }}

      - name: Send Teams Notification
        if: failure()
        run: |
          curl -H 'Content-Type: application/json' -d '{
            "text": "**Sync fails from public 202412 to msft 202412**\n
            - **repo:** '${{ github.repository }}'\n
            - **workflow:** '${{ github.workflow }}'\n
            - **trigger:** '${{ github.actor }}'\n
            - **details:** [details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
